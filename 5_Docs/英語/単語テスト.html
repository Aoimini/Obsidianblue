<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>英単語テスト</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Hiragino Sans', 'Segoe UI', sans-serif;
      background: #0f172a;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 20px;
      color: #f1f5f9;
    }

    .container { width: 100%; max-width: 620px; }

    h1 {
      text-align: center;
      font-size: 1.4rem;
      font-weight: 700;
      color: #e2e8f0;
      margin-bottom: 20px;
      letter-spacing: 0.04em;
    }

    .controls {
      display: flex;
      gap: 10px;
      justify-content: center;
      margin-bottom: 20px;
      flex-wrap: wrap;
    }

    .btn {
      padding: 9px 18px;
      border: none;
      border-radius: 10px;
      cursor: pointer;
      font-size: 0.85rem;
      font-weight: 600;
      transition: all 0.18s;
      font-family: inherit;
    }
    .btn-toggle {
      background: #1e293b;
      color: #94a3b8;
      border: 2px solid #334155;
    }
    .btn-toggle.active {
      background: #6366f1;
      color: #fff;
      border-color: #6366f1;
    }
    .btn-toggle:hover:not(.active) { border-color: #6366f1; color: #c7d2fe; }

    .btn-restart {
      background: #1e293b;
      color: #94a3b8;
      border: 2px solid #334155;
    }
    .btn-restart:hover { border-color: #94a3b8; color: #e2e8f0; }

    .btn-next {
      background: #6366f1;
      color: #fff;
      border: 2px solid #6366f1;
      padding: 11px 32px;
      font-size: 0.95rem;
      margin-top: 18px;
    }
    .btn-next:hover { background: #4f46e5; border-color: #4f46e5; }

    .btn-retry {
      background: #6366f1;
      color: #fff;
      border: 2px solid #6366f1;
      padding: 13px 36px;
      font-size: 1rem;
    }
    .btn-retry:hover { background: #4f46e5; }

    .stats-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 10px;
    }
    .progress-text { font-size: 0.8rem; color: #64748b; }
    .score-text { font-size: 0.8rem; color: #64748b; }

    .progress-bar {
      background: #1e293b;
      border-radius: 999px;
      height: 6px;
      margin-bottom: 22px;
      overflow: hidden;
    }
    .progress-fill {
      background: linear-gradient(90deg, #6366f1, #8b5cf6);
      height: 100%;
      border-radius: 999px;
      transition: width 0.35s ease;
    }

    .card {
      background: #1e293b;
      border-radius: 18px;
      padding: 38px 28px 32px;
      text-align: center;
      margin-bottom: 18px;
      border: 1px solid #334155;
      min-height: 140px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }
    .q-label {
      font-size: 0.7rem;
      text-transform: uppercase;
      letter-spacing: 0.1em;
      color: #6366f1;
      margin-bottom: 14px;
      font-weight: 600;
    }
    .q-text {
      font-size: 1.8rem;
      font-weight: 700;
      color: #f1f5f9;
      line-height: 1.35;
    }

    .options {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 11px;
    }

    .opt-btn {
      padding: 15px 12px;
      background: #1e293b;
      border: 2px solid #334155;
      border-radius: 13px;
      cursor: pointer;
      font-size: 0.88rem;
      color: #cbd5e1;
      transition: all 0.15s;
      line-height: 1.4;
      font-family: inherit;
      text-align: center;
      word-break: break-word;
    }
    .opt-btn:hover:not(:disabled) {
      border-color: #6366f1;
      background: #1e1b4b;
      color: #c7d2fe;
    }
    .opt-btn.correct {
      background: #052e16;
      border-color: #22c55e;
      color: #86efac;
    }
    .opt-btn.wrong {
      background: #3b0764;
      border-color: #f43f5e;
      color: #fca5a5;
    }
    .opt-btn:disabled { cursor: default; }

    .feedback {
      text-align: center;
      font-size: 1rem;
      font-weight: 600;
      min-height: 28px;
      margin-top: 14px;
      color: transparent;
    }
    .feedback.show-correct { color: #4ade80; }
    .feedback.show-wrong { color: #f87171; }

    .next-wrap { text-align: center; }

    /* Result */
    .result-card {
      background: #1e293b;
      border-radius: 18px;
      padding: 52px 28px;
      text-align: center;
      border: 1px solid #334155;
    }
    .result-emoji { font-size: 3.5rem; margin-bottom: 18px; }
    .result-score { font-size: 2rem; font-weight: 700; color: #f1f5f9; margin-bottom: 8px; }
    .result-pct { font-size: 1rem; color: #94a3b8; margin-bottom: 28px; }
    .result-bar-wrap {
      background: #0f172a;
      border-radius: 999px;
      height: 10px;
      margin-bottom: 28px;
      overflow: hidden;
    }
    .result-bar-fill {
      background: linear-gradient(90deg, #6366f1, #8b5cf6);
      height: 100%;
      border-radius: 999px;
    }

    @media (max-width: 480px) {
      .q-text { font-size: 1.4rem; }
      .options { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
<div class="container">
  <h1>英単語テスト</h1>

  <div class="controls">
    <button class="btn btn-toggle active" id="btn-en-ja" onclick="setDir('en-ja')">英 → 日</button>
    <button class="btn btn-toggle" id="btn-ja-en" onclick="setDir('ja-en')">日 → 英</button>
    <button class="btn btn-restart" onclick="restart()">シャッフル ↺</button>
  </div>

  <div id="quiz-area">
    <div class="stats-row">
      <span class="progress-text" id="prog-text">1 / 0</span>
      <span class="score-text" id="score-text">正解: 0 / 0</span>
    </div>
    <div class="progress-bar"><div class="progress-fill" id="prog-fill" style="width:0%"></div></div>

    <div class="card">
      <div class="q-label" id="q-label">英語</div>
      <div class="q-text" id="q-text"></div>
    </div>

    <div class="options" id="options"></div>
    <div class="feedback" id="feedback"></div>
    <div class="next-wrap"><button class="btn btn-next" id="btn-next" onclick="nextQ()" style="display:none">次へ →</button></div>
  </div>

  <div id="result-area" style="display:none">
    <div class="result-card">
      <div class="result-emoji" id="r-emoji"></div>
      <div class="result-score" id="r-score"></div>
      <div class="result-pct" id="r-pct"></div>
      <div class="result-bar-wrap"><div class="result-bar-fill" id="r-bar" style="width:0%"></div></div>
      <button class="btn btn-retry" onclick="restart()">もう一度挑戦</button>
    </div>
  </div>
</div>

let dir = 'en-ja';
let queue = [];
let cur = 0;
let score = 0;
let answered = false;

function shuffle(a) {
  const b = [...a];
  for (let i = b.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [b[i], b[j]] = [b[j], b[i]];
  }
  return b;
}

function setDir(d) {
  dir = d;
  document.getElementById('btn-en-ja').className = 'btn btn-toggle' + (d === 'en-ja' ? ' active' : '');
  document.getElementById('btn-ja-en').className = 'btn btn-toggle' + (d === 'ja-en' ? ' active' : '');
  restart();
}

function restart() {
  queue = shuffle(WORDS);
  cur = 0;
  score = 0;
  answered = false;
  document.getElementById('quiz-area').style.display = '';
  document.getElementById('result-area').style.display = 'none';
  showQ();
}

function showQ() {
  const w = queue[cur];
  const total = queue.length;
  answered = false;

  document.getElementById('prog-fill').style.width = `${(cur / total) * 100}%`;
  document.getElementById('prog-text').textContent = `${cur + 1} / ${total}`;
  document.getElementById('score-text').textContent = `正解: ${score} / ${cur}`;
  document.getElementById('feedback').textContent = '';
  document.getElementById('feedback').className = 'feedback';
  document.getElementById('btn-next').style.display = 'none';

  const isEnJa = dir === 'en-ja';
  document.getElementById('q-label').textContent = isEnJa ? '英語' : '日本語';
  document.getElementById('q-text').textContent = isEnJa ? w.en : w.ja;

  const correct = isEnJa ? w.ja : w.en;
  const pool = WORDS.map(x => isEnJa ? x.ja : x.en).filter(a => a !== correct);
  const wrongs = shuffle(pool).slice(0, 3);
  const opts = shuffle([correct, ...wrongs]);

  const div = document.getElementById('options');
  div.innerHTML = '';
  opts.forEach(opt => {
    const btn = document.createElement('button');
    btn.className = 'opt-btn';
    btn.textContent = opt;
    btn.onclick = () => check(opt, correct);
    div.appendChild(btn);
  });
}

function check(sel, correct) {
  if (answered) return;
  answered = true;

  document.querySelectorAll('.opt-btn').forEach(btn => {
    btn.disabled = true;
    if (btn.textContent === correct) btn.classList.add('correct');
    else if (btn.textContent === sel) btn.classList.add('wrong');
  });

  const fb = document.getElementById('feedback');
  if (sel === correct) {
    score++;
    fb.textContent = '✓ 正解！';
    fb.className = 'feedback show-correct';
  } else {
    fb.textContent = `✗ 不正解　正解: ${correct}`;
    fb.className = 'feedback show-wrong';
  }

  document.getElementById('score-text').textContent = `正解: ${score} / ${cur + 1}`;
  document.getElementById('btn-next').style.display = 'inline-block';
}

function nextQ() {
  cur++;
  if (cur >= queue.length) showResult();
  else showQ();
}

function showResult() {
  document.getElementById('quiz-area').style.display = 'none';
  document.getElementById('result-area').style.display = '';

  const pct = Math.round((score / queue.length) * 100);
  const emoji = pct >= 90 ? '🎉' : pct >= 70 ? '😊' : pct >= 50 ? '💪' : '📖';
  const msg = pct >= 90 ? 'パーフェクトに近い！' : pct >= 70 ? 'よくできました！' : pct >= 50 ? 'まだ伸びしろあり！' : 'もっと練習しよう！';

  document.getElementById('r-emoji').textContent = emoji;
  document.getElementById('r-score').textContent = `${score} / ${queue.length}`;
  document.getElementById('r-pct').textContent = `正答率 ${pct}%　${msg}`;
  document.getElementById('r-bar').style.width = `${pct}%`;
}

document.addEventListener('keydown', e => {
  if (e.key === 'Enter' && !document.getElementById('btn-next').hidden) {
    if (document.getElementById('btn-next').style.display !== 'none') nextQ();
  }
});

restart();
</script>

</html>
