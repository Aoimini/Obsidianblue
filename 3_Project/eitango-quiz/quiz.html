const daysBetween = (a, b) => Math.round((new Date(b + "T00:00:00") - new Date(a + "T00:00:00")) / 86400000);

/* ---- 進捗データベース（localStorage） ----
   word -> {ivl:間隔日数, ease:定着係数, due:'YYYY-MM-DD', bad:直近ミス, last, wrongCount, seenCount}
   簡易SM-2: 正解で ivl×ease に伸長、ミスで ivl半分＋ease低下＋翌日再出題 */
function fromV2(v2) {
  const out = {};
  for (const [w, s] of Object.entries(v2)) {
    const lv = s.level || 0;
    out[w] = {
      ivl: lv > 0 ? INTERVALS[Math.min(lv, INTERVALS.length) - 1] : 1,
      ease: Math.max(EASE_MIN, EASE_START - 0.2 * (s.wrongCount || 0)),
      due: s.due || todayStr(),
      bad: lv === 0 && (s.seenCount || 0) > 0,
      last: s.last, wrongCount: s.wrongCount || 0, seenCount: s.seenCount || 0,
    };
  }
  return out;
}
let state = load(KEY_STATE, null);
if (!state) {
  let v2 = load(KEY_STATE_V2, null);
  if (!v2) { // v1（正解/要復習の2フォルダ方式）→ v2相当へ
    const v1 = load(KEY_STATE_V1, {});
    v2 = {};
    for (const [w, s] of Object.entries(v1)) {
      const ok = s.box === "correct";
      v2[w] = { level: ok ? 1 : 0, due: ok ? addDays(s.last || todayStr(), 1) : todayStr(),
                last: s.last, wrongCount: s.wrongCount || 0, seenCount: s.seenCount || 0 };
    }
  }
  state = fromV2(v2);
  save(KEY_STATE, state);
}
let hist  = load(KEY_HIST, []);    // [{date, total, correct, wrong:[words]}]

const st = w => state[w.w];
/* 3カテゴリ: new=ニュー（未出題） bad=要復習（直近ミス） good=習得済（連続正解中） */
const catOf = w => {
  const s = st(w);
  if (!s || !s.seenCount) return "new";
  return s.bad ? "bad" : "good";
};
const isLeech = w => (st(w)?.wrongCount || 0) >= LEECH_AT;
const isDue = w => { const s = st(w); return !!s && s.seenCount > 0 && (s.due || "") <= todayStr(); };
/* 忘却リスク: 期限をどれだけ超過したかを間隔との比で見る（3日間隔で5日超過 ≫ 60日間隔で5日超過） */
const overdueRatio = w => {
  const s = st(w);
  return daysBetween(s.due || todayStr(), todayStr()) / Math.max(1, s.ivl || 1);
};
/* 間隔が十分育った単語は日→英（想起）で出題 */
const isReverse = w => { const s = st(w); return !!s && !s.bad && (s.ivl || 0) >= REVERSE_AT; };
const shuffle = a => { for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };

/* ---------- 出題の組み立て（1回15問） ----------
   1. 要復習: ミスした単語。誤答回数が多い順
   2. 苦手:   誤答4回以上の単語を最大2語（期限前でも混ぜる）
   3. 復習:   期限が来た単語。忘却リスク（超過÷間隔）が大きい順
   4. ニュー: 未出題。追加日が新しい順（1回最大5語の枠を確保。復習を食い潰さない）
   復習が少ない日はニューが残り枠を全部使う */
const NEW_PER_SESSION = 5;
function buildQuiz() {
  const bad = WORDS.filter(w => isDue(w) && st(w).bad)
                   .sort((a, b) => (st(b).wrongCount || 0) - (st(a).wrongCount || 0));
  const fresh = WORDS.filter(w => catOf(w) === "new").sort((a, b) => b.d.localeCompare(a.d));
  const rev = WORDS.filter(w => isDue(w) && !st(w).bad)
                   .sort((a, b) => overdueRatio(b) - overdueRatio(a));
  const q = [];
  const push = (w, tag) => { if (q.length < SESSION_SIZE && !q.some(x => x.w.w === w.w)) q.push({ w, tag, rev: isReverse(w) }); };
  bad.forEach(w => push(w, isLeech(w) ? "leech" : "bad"));
  if (bad.length + fresh.length + rev.length > 0) {
    WORDS.filter(w => isLeech(w) && !isDue(w) && catOf(w) !== "new")
         .sort((a, b) => (st(b).wrongCount || 0) - (st(a).wrongCount || 0))
         .slice(0, LEECH_MIX).forEach(w => push(w, "leech"));
  }
  const newTarget = Math.min(NEW_PER_SESSION, fresh.length);
  rev.forEach(w => { if (q.length < SESSION_SIZE - newTarget) push(w, isLeech(w) ? "leech" : "rev"); });
  fresh.forEach(w => push(w, "new"));
  rev.forEach(w => push(w, isLeech(w) ? "leech" : "rev"));   // ニューが5語未満なら復習で埋める
  return q;
}
function buildRandomQuiz() {
  return shuffle([...WORDS]).slice(0, SESSION_SIZE)
    .map(w => ({ w, tag: isLeech(w) ? "leech" : catOf(w) === "bad" ? "bad" : catOf(w) === "new" ? "new" : "rev", rev: isReverse(w) }));
}

/* 難しめの4択: 品詞ラベルや意味の長さが近いものを誤答に選ぶ */
function distractors(word) {
  const posOf = m => (m.match(/前置詞|接続詞|副詞|形容詞|動詞|名詞/) || [""])[0];
  const t = posOf(word.m);
  const pool = WORDS.filter(w => w.w !== word.w && w.m !== word.m);
  const scored = pool.map(w => {
    let s = Math.random();
    if (t && posOf(w.m) === t) s += 2;                                  // 同じ品詞ラベル
    s += 1 - Math.min(1, Math.abs(w.m.length - word.m.length) / 12);    // 意味の長さが近い
    return { m: w.m, s };
  }).sort((a, b) => b.s - a.s);
  const out = [];
  for (const c of scored) { if (!out.includes(c.m)) out.push(c.m); if (out.length === 3) break; }
  return out;
}
/* 日→英用の誤答: 語長・頭文字が近い英単語を選ぶ */
function distractorsEn(word) {
  const pool = WORDS.filter(w => w.w !== word.w && w.m !== word.m);
  const scored = pool.map(w => {
    let s = Math.random();
    if (w.w[0]?.toLowerCase() === word.w[0]?.toLowerCase()) s += 1.5;   // 同じ頭文字
    s += 1 - Math.min(1, Math.abs(w.w.length - word.w.length) / 8);     // 語長が近い
    return { w: w.w, s };
  }).sort((a, b) => b.s - a.s);
  const out = [];
  for (const c of scored) { if (!out.includes(c.w)) out.push(c.w); if (out.length === 3) break; }
  return out;
}

/* ---------- ダッシュボード ---------- */
const $ = id => document.getElementById(id);
let quiz = [], idx = 0, hits = 0, misses = [];
let phase = "main", relearn = [], relearnTotal = 0, qStart = 0;

function donutSVG(counts) {
  const total = counts.new + counts.bad + counts.good;
  const pct = total ? Math.round((counts.good / total) * 100) : 0;
  const R = 82, C = 2 * Math.PI * R, GAP = 3;
  const segs = [
    { n: counts.good, color: "var(--good)" },
    { n: counts.bad,  color: "var(--bad)" },
    { n: counts.new,  color: "var(--new)" },
  ].filter(s => s.n > 0);
  let off = -C / 4;
  const arcs = segs.map(s => {
    const len = (s.n / total) * C;
    const gap = segs.length > 1 ? GAP : 0;
    const a = `<circle class="seg" r="${R}" cx="105" cy="105" fill="none"
      stroke="${s.color}" stroke-width="18"
      stroke-dasharray="${Math.max(0, len - gap)} ${C - Math.max(0, len - gap)}"
      stroke-dashoffset="${-off}" />`;
    off += len;
    return a;
  }).join("");
  return `
    <svg class="donut" viewBox="0 0 210 210" role="img" aria-label="習得率 ${pct}%（習得済${counts.good}語・要復習${counts.bad}語・ニュー${counts.new}語）">
      <circle class="track" r="${R}" cx="105" cy="105" fill="none" stroke-width="18"/>
      ${arcs}
      <g class="donut-center" text-anchor="middle">
        <text x="105" y="112"><tspan class="pct">${pct}</tspan><tspan class="pctmark" dx="2">%</tspan></text>
        <text x="105" y="136" class="sub">習得率</text>
      </g>
    </svg>`;
}

function startSession(items) {
  quiz = items; idx = 0; hits = 0; misses = [];
  phase = "main"; relearn = []; relearnTotal = 0;
  renderQuestion();
}

function renderIntro() {
  const counts = { new: 0, bad: 0, good: 0 };
  WORDS.forEach(w => counts[catOf(w)]++);
  const leeches = WORDS.filter(isLeech).length;
  const today = buildQuiz();
  const c = { bad: 0, new: 0, rev: 0, leech: 0 };
  today.forEach(q => c[q.tag]++);
  const doneAll = today.length === 0;
  $("view-test").innerHTML = `
    <div class="card intro">
      <div class="donutwrap">${donutSVG(counts)}</div>
      <div class="cats">
        <div class="cat c-new">
          <div class="n">${counts.new}<small>語</small></div>
          <div class="l"><span class="dot new"></span>ニュー</div>
          <div class="en">NEW</div>
        </div>
        <div class="cat c-bad">
          <div class="n">${counts.bad}<small>語</small></div>
          <div class="l"><span class="dot bad"></span>要復習</div>
          <div class="en">REVIEW</div>
        </div>
        <div class="cat c-good">
          <div class="n">${counts.good}<small>語</small></div>
          <div class="l"><span class="dot good"></span>習得済</div>
          <div class="en">MASTERED</div>
        </div>
      </div>
      ${doneAll ? "" : `<div class="mix">
        ${c.bad ? `<span class="chip bad">要復習 ${c.bad}</span>` : ""}
        ${c.leech ? `<span class="chip leech">苦手 ${c.leech}</span>` : ""}
        ${c.new ? `<span class="chip new">ニュー ${c.new}</span>` : ""}
        ${c.rev ? `<span class="chip rev">復習 ${c.rev}</span>` : ""}
      </div>`}
      <div class="actions">
        <button class="btn" id="start" ${doneAll ? "disabled" : ""}>${doneAll ? "今日の復習はすべて完了 🎉" : `今日のテスト（${today.length}問）`}</button>
        <button class="btn ghost" id="random">ランダム${SESSION_SIZE}問</button>
      </div>
      <p class="note">忘却曲線に沿った出題です。間違えた単語はその場で解き直し＆間隔が縮んで翌日再出題。正解すると単語ごとの定着度に応じて間隔が伸びます（目安 1→3→8→20→50日）。誤答${LEECH_AT}回以上は「苦手」として毎回混ざり、よく育った単語は日本語→英語で出ます。</p>
    </div>`;
  if (!doneAll) $("start").onclick = () => startSession(today);
  $("random").onclick = () => startSession(buildRandomQuiz());
}

function currentItem() { return phase === "main" ? quiz[idx] : relearn[0]; }

function renderQuestion() {
  const q = currentItem(), word = q.w;
  const reverse = q.rev;
  const correct = reverse ? word.w : word.m;
  const opts = shuffle(reverse ? [word.w, ...distractorsEn(word)] : [word.m, ...distractors(word)]);
  const tagLabel = { bad: "要復習", new: "ニュー", rev: "復習", leech: "苦手" }[q.tag];
  const headRight = phase === "main"
    ? `${idx + 1} / ${quiz.length}`
    : `解き直し 残り${relearn.length}語`;
  const prog = phase === "main"
    ? (idx / quiz.length) * 100
    : ((relearnTotal - relearn.length) / Math.max(1, relearnTotal)) * 100;
  $("view-test").innerHTML = `
    <div class="card">
      <div class="qmeta">
        <span class="tags">
          <span class="qtag ${q.tag}">${phase === "relearn" ? "解き直し" : tagLabel}</span>
          ${reverse ? `<span class="qtag dir">日→英</span>` : ""}
        </span>
        <span>${headRight}</span>
      </div>
      <div class="bar"><i style="width:${prog}%"></i></div>
      <div class="word ${reverse ? "ja" : ""}" ${reverse ? "" : 'lang="en"'}>${esc(reverse ? word.m : word.w)}</div>
      <div class="choices">
        ${opts.map(m => `<button class="choice ${reverse ? "en" : ""}" ${reverse ? 'lang="en"' : ""}>${esc(m)}</button>`).join("")}
      </div>
      <div id="after"></div>
    </div>`;
  qStart = Date.now();
  document.querySelectorAll(".choice").forEach(btn => {
    btn.onclick = () => answer(btn, btn.textContent === correct, q);
  });
}

function answer(btn, ok, q) {
  const word = q.w;
  const correct = q.rev ? word.w : word.m;
  const elapsed = Date.now() - qStart;
  document.querySelectorAll(".choice").forEach(b => {
    b.disabled = true;
    if (b.textContent === correct) b.classList.add("hit");
  });
  if (!ok) btn.classList.add("miss");

  if (phase === "main") {
    // SRS更新は本編のみ（解き直しは練習扱い）
    const s = state[word.w] || { ivl: 0, ease: EASE_START, wrongCount: 0, seenCount: 0, bad: false };
    if (s.ease == null) s.ease = EASE_START;
    s.seenCount++; s.last = todayStr();
    if (ok) {
      if (s.bad) {
        s.bad = false;                    // ミス後の復帰: 半分に縮めた間隔から再開
      } else if (s.ivl < 1) {
        s.ivl = 1;                        // 初正解: 翌日
      } else {
        s.ivl = Math.min(365, Math.max(s.ivl + 1, Math.round(s.ivl * s.ease)));
      }
      if (elapsed < FAST_MS) s.ease = Math.min(EASE_MAX, s.ease + 0.1);  // 余裕の正解→伸びを速く
      s.due = addDays(todayStr(), s.ivl);
      hits++;
    } else {
      s.bad = true;
      s.wrongCount = (s.wrongCount || 0) + 1;
      s.ease = Math.max(EASE_MIN, s.ease - 0.2);                          // ミス→伸びを遅く
      s.ivl = Math.max(1, Math.floor((s.ivl || 1) / 2));                  // 完全リセットではなく半分戻し
      s.due = addDays(todayStr(), 1);                                     // 明日再出題
      misses.push(q);
    }
    state[word.w] = s; save(KEY_STATE, state);
  }

  const verdictExtra = phase === "main" && !ok ? "（あとで解き直します）" : "";
  $("after").innerHTML = `
    <div class="verdict ${ok ? "ok" : "ng"}">${ok ? "⭕ 正解" : "❌ 不正解"}　<span style="font-weight:600">${esc(word.w)} — ${esc(word.m)}</span>${verdictExtra}</div>
    <button class="btn nextbtn" id="next">次へ</button>`;
  $("next").onclick = () => nextStep(ok);
  $("next").focus();
}

function nextStep(ok) {
  if (phase === "main") {
    idx++;
    if (idx < quiz.length) return renderQuestion();
    if (misses.length) {           // ①ミスをその場で解き直し（正解するまで）
      phase = "relearn";
      relearn = shuffle([...misses]);
      relearnTotal = relearn.length;
      return renderQuestion();
    }
    return renderResult();
  }
  // relearn: 正解したら消化、ミスなら列の後ろへ
  if (ok) relearn.shift();
  else relearn.push(relearn.shift());
  if (relearn.length) return renderQuestion();
  return renderResult();
}

function renderResult() {
  hist.unshift({ date: todayStr(), total: quiz.length, correct: hits, wrong: misses.map(q => q.w.w) });
  hist = hist.slice(0, 60); save(KEY_HIST, hist);
  const rate = Math.round((hits / quiz.length) * 100);
  $("view-test").innerHTML = `
    <div class="card result">
      <h2>結果</h2>
      <div class="score">${hits}<small> / ${quiz.length}（${rate}%）</small></div>
      ${misses.length ? `<ul class="wronglist">${misses.map(q => `<li><b>${esc(q.w.w)}</b> — ${esc(q.w.m)}</li>`).join("")}</ul>
        <p class="note">↑ この${misses.length}語は解き直し済み。間隔が縮んで明日また出ます。</p>` : `<p class="note">全問正解！それぞれ次の復習間隔まで出題されません 🎉</p>`}
      <button class="btn" id="again" style="margin-top:12px">ホームに戻る</button>
      <button class="btn ghost" id="tobook" style="margin-top:8px">単語帳を見る</button>
    </div>`;
  $("again").onclick = renderIntro;
  $("tobook").onclick = () => switchTab("book");
}

/* ---------- 単語帳ビュー ---------- */
function renderBook() {
  const groups = [
    { key: "leech", label: `苦手（誤答${LEECH_AT}回以上）`, dot: "leech" },
    { key: "bad",   label: "要復習（ミスした単語）",   dot: "bad" },
    { key: "new",   label: "ニュー（未出題）",         dot: "new" },
    { key: "good",  label: "習得済（連続正解中）",     dot: "good" },
  ];
  $("view-book").innerHTML = groups.map(g => {
    const items = WORDS.filter(w => g.key === "leech" ? isLeech(w) : (!isLeech(w) && catOf(w) === g.key))
      .sort((a, b) => {
        if (g.key === "new") return b.d.localeCompare(a.d);                                    // 追加が新しい順
        if (g.key === "leech" || g.key === "bad") return (st(b)?.wrongCount || 0) - (st(a)?.wrongCount || 0); // ミスが多い順
        return (st(a)?.due || "").localeCompare(st(b)?.due || "");                             // 次回が近い順
      });
    return `<div class="group">
      <h3><span class="dot ${g.dot}"></span>${g.label}<span class="count">${items.length}語</span></h3>
      <div class="entries">${items.length ? items.map(w => {
        const s = state[w.w];
        const meta = [`追加 ${w.d}`]
          .concat(s?.due ? [`次回 ${s.due}`] : [])
          .concat(s?.ivl ? [`間隔${s.ivl}日`] : [])
          .concat(s?.wrongCount ? [`誤答${s.wrongCount}回`] : []).join("　");
        return `<div class="entry"><span class="w" lang="en">${esc(w.w)}</span><div class="m">${esc(w.m)}</div><div class="meta">${meta}</div></div>`;
      }).join("") : `<div class="empty">なし</div>`}</div>
    </div>`;
  }).join("");
}

/* ---------- きろくビュー（履歴 + 進捗データのバックアップ） ---------- */
function renderLog() {
  const sessions = hist.length ? hist.map(h => {
    const rate = h.correct / h.total;
    return `<div class="session">
      <div class="head"><span>${h.date}</span><span class="sc ${rate >= .8 ? "ok" : "ng"}">${h.correct} / ${h.total}</span></div>
      ${h.wrong.length ? `<div class="miss">間違い: ${h.wrong.map(esc).join("、")}</div>` : ""}
    </div>`;
  }).join("") : `<div class="card"><p class="note" style="margin:0">まだ記録がありません。最初のテストを解くとここに積み上がります。</p></div>`;
  $("view-log").innerHTML = `${sessions}
    <div class="card datacard" style="margin-top:14px">
      <h3 style="margin-top:0">進捗データ（この端末のブラウザに保存）</h3>
      <p class="note" style="margin-top:0">単語の習熟レベルとテスト履歴はこの端末のブラウザ内データベース（localStorage）に記録されています。別の端末に引き継ぐときは、書き出したデータを相手の端末で読み込んでください。</p>
      <div class="datarow">
        <button class="btn ghost" id="exportbtn">書き出す</button>
        <button class="btn ghost" id="importbtn">読み込む</button>
      </div>
      <div id="dataarea"></div>
    </div>`;
  $("exportbtn").onclick = () => {
    const payload = JSON.stringify({ v: 3, state, hist });
    $("dataarea").innerHTML = `
      <h3>書き出しデータ（全文をコピーして保存）</h3>
      <textarea readonly id="exp">${esc(payload)}</textarea>
      <div class="flash ok" id="expmsg"></div>`;
    const ta = $("exp"); ta.focus(); ta.select();
    try { navigator.clipboard?.writeText(payload).then(() => { $("expmsg").textContent = "クリップボードにコピーしました"; }); } catch {}
  };
  $("importbtn").onclick = () => {
    $("dataarea").innerHTML = `
      <h3>読み込み（書き出したデータを貼り付け）</h3>
      <textarea id="imp" placeholder='{"v":3,"state":{...},"hist":[...]}'></textarea>
      <div class="datarow"><button class="btn" id="doimport">この内容で置き換える</button></div>
      <div class="flash" id="impmsg"></div>`;
    $("doimport").onclick = () => {
      const msg = $("impmsg");
      try {
        const d = JSON.parse($("imp").value);
        if (!d || typeof d.state !== "object" || !Array.isArray(d.hist)) throw new Error("形式が違います");
        state = d.v >= 3 ? d.state : fromV2(d.state);   // 旧v2の書き出しも受け付ける
        hist = d.hist;
        save(KEY_STATE, state); save(KEY_HIST, hist);
        msg.className = "flash ok"; msg.textContent = "読み込みました。進捗を置き換えています。";
        setTimeout(renderLog, 900);
      } catch (e) {
        msg.className = "flash ng"; msg.textContent = "読み込めませんでした。書き出したデータをそのまま貼り付けてください。";
      }
    };
  };
}

/* ---------- 共通 ---------- */
function esc(s) { const d = document.createElement("span"); d.textContent = s; return d.innerHTML; }
function switchTab(name) {
  ["test", "book", "log"].forEach(t => {
    $("tab-" + t).classList.toggle("on", t === name);
    $("view-" + t).hidden = t !== name;
  });
  if (name === "book") renderBook();
  if (name === "log") renderLog();
  if (name === "test") renderIntro();
}
