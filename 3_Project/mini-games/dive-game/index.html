<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>DIVE — ダイビングゲーム</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: #04111c; font-family: -apple-system, "Helvetica Neue", Arial, sans-serif; color: #fff; }
  #app { position: fixed; inset: 0; }
  canvas { display: block; }

  #water-rays {
    position: fixed;
    inset: 0;
    pointer-events: none;
    background:
      linear-gradient(105deg, transparent 4%, rgba(255,255,255,.13) 8%, transparent 15%),
      linear-gradient(118deg, transparent 20%, rgba(255,255,255,.1) 25%, transparent 33%),
      linear-gradient(78deg, transparent 55%, rgba(255,255,255,.08) 61%, transparent 72%);
    mix-blend-mode: screen;
    opacity: .5;
    z-index: 4;
  }

  #mask-overlay {
    position: fixed;
    inset: 0;
    pointer-events: none;
    z-index: 8;
  }
  #mask-overlay::before {
    content: "";
    position: absolute;
    inset: 10px;
    border: 18px solid #7b3a12;
    border-radius: 38% / 50%;
    box-shadow:
      inset 0 0 42px rgba(0,0,0,.62),
      0 0 0 999px rgba(1,10,17,.18);
  }
  #mask-overlay::after {
    content: "";
    position: absolute;
    inset: 0;
    background:
      radial-gradient(ellipse at center, transparent 52%, rgba(0,0,0,.34) 84%),
      linear-gradient(90deg, rgba(0,0,0,.25), transparent 16%, transparent 84%, rgba(0,0,0,.25));
  }

  #danger-vignette {
    position: fixed;
    inset: 0;
    pointer-events: none;
    z-index: 9;
    opacity: 0;
    background:
      radial-gradient(ellipse at center, transparent 44%, rgba(255,0,0,.2) 69%, rgba(180,0,0,.62) 100%);
    transition: opacity .12s linear;
  }

  #hands {
    position: fixed;
    inset: 0;
    pointer-events: none;
    z-index: 10;
  }
  .hand {
    position: absolute;
    bottom: -34px;
    width: 118px;
    height: 76px;
    background: linear-gradient(135deg, #8c583f, #c18461);
    border-radius: 44% 34% 26% 38%;
    filter: drop-shadow(0 10px 15px rgba(0,0,0,.28));
    opacity: .95;
  }
  .hand.left { left: 13%; transform: rotate(12deg); }
  .hand.right { right: 12%; transform: rotate(-18deg); }
  .hand::before {
    content: "";
    position: absolute;
    top: -21px;
    left: 12px;
    width: 16px;
    height: 48px;
    border-radius: 10px;
    background: linear-gradient(#b97858, #8d523a);
    box-shadow: 22px 2px 0 #a96d50, 44px 5px 0 #9e6248, 65px 8px 0 #8e543e;
  }
  #held-tool {
    position: absolute;
    right: 15%;
    bottom: 18px;
    width: 150px;
    height: 54px;
    border-radius: 999px 40px 40px 999px;
    background:
      radial-gradient(circle at 20% 50%, #ffe96e 0 16%, #11283a 17% 24%, transparent 25%),
      linear-gradient(90deg, #2c6379, #80c6d2);
    transform: rotate(-24deg);
    box-shadow: inset 0 -10px 20px rgba(0,0,0,.25), 0 8px 18px rgba(0,0,0,.28);
  }
  #held-tool.net::after {
    content: "";
    position: absolute;
    right: -42px;
    top: -16px;
    width: 52px;
    height: 52px;
    border: 5px solid rgba(210,245,255,.9);
    border-radius: 50%;
    box-shadow: inset 0 0 0 1px rgba(255,255,255,.35);
  }
  #held-tool.spear::after {
    content: "";
    position: absolute;
    right: -94px;
    top: 24px;
    width: 100px;
    height: 4px;
    background: linear-gradient(90deg, #d7f6ff, #ffffff);
    box-shadow: 88px -4px 0 -1px #ffffff;
  }

  /* ---- HUD ---- */
  #hud { position: fixed; inset: 0; pointer-events: none; user-select: none; z-index: 12; }

  /* 酸素バー（左下） */
  #oxygen-wrap { position: absolute; left: 22px; bottom: 22px; width: 240px; }
  #oxygen-label { font-size: 11px; letter-spacing: 2px; opacity: .85; margin-bottom: 4px; }
  #oxygen-bar-bg { width: 100%; height: 16px; background: rgba(0,0,0,.45); border: 1px solid rgba(255,255,255,.35); border-radius: 8px; overflow: hidden; }
  #oxygen-bar { height: 100%; width: 100%; background: linear-gradient(90deg,#ffd24a,#ff8a3d); transition: width .1s linear; }
  #oxygen-num { font-size: 12px; margin-top: 3px; opacity: .8; }

  /* かご + 売上（右下） */
  #basket { position: absolute; right: 22px; bottom: 22px; text-align: right; }
  #basket .row { font-size: 13px; margin: 2px 0; }
  #basket .big { font-size: 22px; font-weight: 700; color: #ffe27a; }
  #weight-bar-bg { width: 180px; height: 8px; background: rgba(0,0,0,.45); border:1px solid rgba(255,255,255,.3); border-radius: 4px; margin: 4px 0 0 auto; overflow:hidden; }
  #weight-bar { height: 100%; width: 0%; background:#6fe3ff; transition: width .2s; }

  /* コンパス（上中央） */
  #compass { position: absolute; top: 16px; left: 50%; transform: translateX(-50%); display:flex; align-items:center; gap:8px; background: rgba(0,20,35,.45); padding: 7px 16px; border-radius: 20px; border:1px solid rgba(255,255,255,.18); font-size: 15px; letter-spacing:1px; }
  #compass.alert { background: rgba(120,20,20,.6); border-color:#ff7a7a; animation: pulse 1s infinite; }
  #compass-arrow { display:inline-block; font-size:18px; transition: transform .1s linear; }
  @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:.45} }

  /* 装備（中央下） */
  #gear { position:absolute; left:50%; bottom:22px; transform:translateX(-50%); display:flex; gap:10px; }
  .gear-item { padding:6px 14px; border-radius:8px; font-size:13px; background:rgba(0,0,0,.4); border:1px solid rgba(255,255,255,.25); opacity:.5; }
  .gear-item.active { opacity:1; border-color:#6fe3ff; background:rgba(20,80,110,.6); box-shadow:0 0 12px rgba(111,227,255,.4); }
  .gear-item small{ opacity:.7; }

  /* 帰還矢印（画面端） */
  #return-arrow { position:absolute; top:50%; left:50%; font-size:46px; color:#ff6b6b; opacity:0; transition:opacity .3s; text-shadow:0 0 10px rgba(0,0,0,.8); transform-origin:center; }

  /* クロスヘア */
  #crosshair { position:absolute; top:50%; left:50%; transform:translate(-50%,-50%); width:22px; height:22px; }
  #crosshair::before,#crosshair::after{content:'';position:absolute;background:rgba(255,255,255,.7)}
  #crosshair::before{left:50%;top:0;width:1.5px;height:100%;transform:translateX(-50%)}
  #crosshair::after{top:50%;left:0;height:1.5px;width:100%;transform:translateY(-50%)}

  /* トースト通知 */
  #toast { position:absolute; top:64px; left:50%; transform:translateX(-50%); font-size:16px; padding:8px 18px; background:rgba(0,0,0,.55); border-radius:8px; opacity:0; transition:opacity .25s; }
  #toast.show{opacity:1}

  /* 深度 */
  #depth { position:absolute; left:22px; top:16px; font-size:12px; opacity:.7; }
  #surface-hint { position:absolute; left:22px; top:36px; font-size:12px; opacity:0; color:#bff7ff; transition:opacity .2s; }
  #danger-text { position:absolute; left:50%; top:84px; transform:translateX(-50%); color:#ffdfdf; font-weight:800; letter-spacing:5px; font-size:18px; opacity:0; text-shadow:0 0 12px #ff1e1e; transition:opacity .12s; }

  /* オーバーレイ（スタート/結果） */
  .overlay { position:fixed; inset:0; background:linear-gradient(180deg,rgba(2,20,35,.92),rgba(2,8,15,.96)); display:flex; flex-direction:column; align-items:center; justify-content:center; text-align:center; z-index:20; padding:20px; }
  .overlay.hidden { display:none; }
  .overlay h1 { font-size:44px; letter-spacing:6px; margin-bottom:6px; }
  .overlay h1 span{ color:#6fe3ff }
  .overlay p { opacity:.85; line-height:1.9; font-size:14px; max-width:560px; }
  .overlay .keys { margin:18px 0; font-size:13px; opacity:.9; line-height:2; }
  .overlay .keys b{ color:#ffe27a; }
  .btn { margin-top:14px; pointer-events:auto; cursor:pointer; padding:13px 36px; font-size:16px; letter-spacing:2px; border:none; border-radius:30px; background:linear-gradient(90deg,#36c6ff,#6fe3ff); color:#04111c; font-weight:700; }
  .btn:hover{ filter:brightness(1.1); }
  #result-list { font-size:16px; line-height:2.1; margin:10px 0; min-width:280px; }
  #result-list .line{ display:flex; justify-content:space-between; gap:40px; }
  #result-list .dmg{ color:#ff9a9a; }
  #result-total{ font-size:30px; font-weight:700; color:#ffe27a; border-top:1px solid rgba(255,255,255,.3); margin-top:10px; padding-top:10px; }
  #result-sub{ font-size:13px; opacity:.7; margin-top:6px;}
</style>
</head>
<body>
<div id="app"></div>
<div id="water-rays"></div>
<div id="danger-vignette"></div>
<div id="mask-overlay"></div>
<div id="hands">
  <div class="hand left"></div>
  <div class="hand right"></div>
  <div id="held-tool" class="spear"></div>
</div>

<!-- HUD -->
<div id="hud">
  <div id="crosshair"></div>
  <div id="depth">DEPTH 0.0m</div>
  <div id="surface-hint">SURFACE: 呼吸中</div>
  <div id="danger-text">DANGER</div>

  <div id="compass">
    <span>BOAT</span>
    <span id="compass-dist">0m</span>
    <span id="compass-arrow">→</span>
  </div>

  <div id="oxygen-wrap">
    <div id="oxygen-label">OXYGEN</div>
    <div id="oxygen-bar-bg"><div id="oxygen-bar"></div></div>
    <div id="oxygen-num">180s</div>
  </div>

  <div id="basket">
    <div class="row">かご <span id="basket-weight">0</span> / 10 kg</div>
    <div id="weight-bar-bg"><div id="weight-bar"></div></div>
    <div class="row" style="margin-top:8px">売上見込み</div>
    <div class="big"><span id="basket-value">0</span> 円</div>
  </div>

  <div id="gear">
    <div class="gear-item active" id="gear-spear">銛 <small>1</small></div>
    <div class="gear-item" id="gear-net">網 <small>2</small></div>
  </div>

  <div id="return-arrow">▲</div>
  <div id="toast"></div>
</div>

<!-- スタート画面 -->
<div class="overlay" id="start-screen">
  <h1>D<span>I</span>VE</h1>
  <p>酸素が尽きる前に魚を捕り、船へ帰還して売上を確定しろ。<br>奥へ行くほど危険で、稼げる。</p>
  <div class="keys">
    <b>WASD</b> 移動　<b>マウス</b> 視点　<b>Space</b> 上昇　<b>Shift</b> 下降<br>
    <b>左クリック</b> 捕獲　<b>1 / 2</b> 銛・網切替　<b>E</b> 船の近くで帰還確定<br>
    <span style="opacity:.72">水面に出るとどこでも呼吸できます。深海では赤いアラートに注意。</span><br>
    <span style="opacity:.6">※マウスが効かない時は矢印キーで視点移動できます</span>
  </div>
  <button class="btn" id="start-btn">潜る</button>
</div>

<!-- 結果画面 -->
<div class="overlay hidden" id="result-screen">
  <h1 id="result-title">帰還</h1>
  <div id="result-list"></div>
  <div id="result-total">合計 0 円</div>
  <div id="result-sub"></div>
  <button class="btn" id="restart-btn">もう一度潜る</button>
</div>

<script src="https://cdn.jsdelivr.net/npm/three@0.158.0/build/three.min.js"></script>
<script>
"use strict";
// ============================================================
//  DIVE — 最小完成版 ダイビングゲーム
// ============================================================
const THREEJS = window.THREE;

// ---- 設定 ----
const CFG = {
  oxygenStart: 180,
  oxygenTank: 45,
  deepDrainMul: 1.6,     // 深場での酸素消費倍率
  surfaceRecover: 34,    // 水面での酸素回復(秒/秒)
  jellyDamage: 10,       // クラゲ接触ダメージ(秒)
  hunterDamage: 30,
  basketMax: 10,
  surfaceY: 0,
  seabedY: -32,
  boatPos: new THREEJS.Vector3(0, 0, 8),
  returnRadius: 7,       // 船から帰還可能な水平距離
};

// 魚の定義
const FISH_DEF = {
  aji: { name:'鯵', value:100, weight:1, color:0xcfd8e0, size:0.7, speed:2.2, detect:9,  zone:'shallow' },
  saba:{ name:'鯖', value:180, weight:2, color:0x4a8fb0, size:0.95,speed:3.4, detect:11, zone:'rocky'   },
  ika: { name:'イカ',value:320, weight:2, color:0xf2e6d8, size:1.0, speed:5.0, detect:13, zone:'deep'    },
};

// ゾーン境界（-Z方向に進むほど奥）
const ZONE = {
  shallow:{ zMin:-42, zMax:6  },
  rocky:  { zMin:-95, zMax:-42 },
  deep:   { zMin:-160,zMax:-95 },
};
function zoneAt(z){ if(z > ZONE.shallow.zMin) return 'shallow'; if(z > ZONE.rocky.zMin) return 'rocky'; return 'deep'; }

// ---- グローバル状態 ----
let scene, camera, renderer, clock;
let player = {
  vel: new THREEJS.Vector3(),
  yaw: 0, pitch: -0.1,
};
let state = {
  running:false, oxygen:CFG.oxygenStart, gear:'spear',
  basketWeight:0, basketValue:0, caught:[], // {key, method}
  stun:0, inkTimer:0, hunterAlert:0,
};
let fishes = [], jellies = [], tanks = [];
let swayers = [], snow = null, causticMat = null;
let hunter = null;
const keys = {};
let pointerLocked = false;

const $ = id => document.getElementById(id);

// ============================================================
//  プロシージャル・テクスチャ
// ============================================================
function makeCanvas(w,h){ const c=document.createElement('canvas'); c.width=w; c.height=h||w; return c; }

function sandTexture(){
  const s=256, c=makeCanvas(s), x=c.getContext('2d');
  x.fillStyle='#d8c290'; x.fillRect(0,0,s,s);
  for(let i=0;i<12000;i++){
    const v=Math.random();
    x.fillStyle = v<0.45? `rgba(168,146,100,${.12+Math.random()*.22})`
                : v<0.8 ? `rgba(228,212,168,${.18+Math.random()*.28})`
                :         `rgba(120,104,70,${.12+Math.random()*.18})`;
    x.beginPath(); x.arc(Math.random()*s, Math.random()*s, Math.random()*1.8+0.4, 0, 7); x.fill();
  }
  x.globalAlpha=0.06; x.strokeStyle='#7a6848'; x.lineWidth=3;
  for(let i=0;i<14;i++){ x.beginPath(); for(let xx=0;xx<=s;xx+=8){ const yy=i*20+Math.sin(xx*0.05+i)*7; xx===0?x.moveTo(xx,yy):x.lineTo(xx,yy);} x.stroke(); }
  x.globalAlpha=1;
  const t=new THREEJS.CanvasTexture(c); t.wrapS=t.wrapT=THREEJS.RepeatWrapping; t.repeat.set(14,14); return t;
}

function causticsTexture(){
  const s=256, c=makeCanvas(s), x=c.getContext('2d');
  x.fillStyle='#000'; x.fillRect(0,0,s,s);
  x.globalCompositeOperation='lighter';
  for(let i=0;i<34;i++){
    const cx=Math.random()*s, cy=Math.random()*s, r=18+Math.random()*55;
    const g=x.createRadialGradient(cx,cy,0,cx,cy,r);
    g.addColorStop(0,'rgba(190,235,255,0.6)');
    g.addColorStop(0.45,'rgba(120,205,240,0.14)');
    g.addColorStop(1,'rgba(0,0,0,0)');
    x.fillStyle=g; x.beginPath(); x.arc(cx,cy,r,0,7); x.fill();
  }
  const t=new THREEJS.CanvasTexture(c); t.wrapS=t.wrapT=THREEJS.RepeatWrapping; t.repeat.set(5,5); return t;
}

function dotTexture(){
  const s=32, c=makeCanvas(s), x=c.getContext('2d');
  const g=x.createRadialGradient(s/2,s/2,0,s/2,s/2,s/2);
  g.addColorStop(0,'rgba(255,255,255,1)'); g.addColorStop(.5,'rgba(255,255,255,.5)'); g.addColorStop(1,'rgba(255,255,255,0)');
  x.fillStyle=g; x.fillRect(0,0,s,s); return new THREEJS.CanvasTexture(c);
}

// 枝分かれするウミウチワの透過テクスチャ
function seaFanTexture(col){
  const s=256, c=makeCanvas(s), x=c.getContext('2d');
  x.translate(s/2, s-8); x.strokeStyle=col; x.lineCap='round';
  (function branch(len,ang,w){
    if(len<6||w<0.5) return;
    x.lineWidth=w;
    const nx=Math.sin(ang)*len, ny=-Math.cos(ang)*len;
    x.beginPath(); x.moveTo(0,0); x.lineTo(nx,ny); x.stroke();
    x.save(); x.translate(nx,ny);
    branch(len*0.78, ang-0.35-Math.random()*0.15, w*0.72);
    branch(len*0.78, ang+0.35+Math.random()*0.15, w*0.72);
    if(Math.random()<0.4) branch(len*0.6, ang+(Math.random()-.5)*0.2, w*0.6);
    x.restore();
  })(58,0,9);
  return new THREEJS.CanvasTexture(c);
}

// ============================================================
//  初期化
// ============================================================
function init(){
  scene = new THREEJS.Scene();
  scene.background = new THREEJS.Color(0x2596bd);
  scene.fog = new THREEJS.FogExp2(0x2596bd, 0.012);

  camera = new THREEJS.PerspectiveCamera(72, innerWidth/innerHeight, 0.1, 400);

  renderer = new THREEJS.WebGLRenderer({ antialias:true });
  renderer.setSize(innerWidth, innerHeight);
  renderer.setPixelRatio(Math.min(devicePixelRatio,2));
  $('app').appendChild(renderer.domElement);

  // ライト
  const amb = new THREEJS.AmbientLight(0x88bbdd, 0.7);
  scene.add(amb);
  const sun = new THREEJS.DirectionalLight(0xcfeaff, 0.9);
  sun.position.set(20, 60, 10);
  scene.add(sun);
  const shallowFill = new THREEJS.HemisphereLight(0x8ee8ff, 0xd7c58a, 0.9);
  scene.add(shallowFill);

  buildWorld();
  clock = new THREEJS.Clock();
  bindEvents();
  animate();
}

// ============================================================
//  ワールド生成
// ============================================================
function buildWorld(){
  // --- 海面 ---
  const surfGeo = new THREEJS.PlaneGeometry(400, 400, 1, 1);
  const surfMat = new THREEJS.MeshBasicMaterial({ color:0x2aa3c8, transparent:true, opacity:0.35, side:THREEJS.DoubleSide });
  const surf = new THREEJS.Mesh(surfGeo, surfMat);
  surf.rotation.x = -Math.PI/2;
  surf.position.y = CFG.surfaceY;
  scene.add(surf);

  // --- 海底 ---
  const bedGeo = new THREEJS.PlaneGeometry(400, 400, 60, 60);
  const pos = bedGeo.attributes.position;
  for(let i=0;i<pos.count;i++){
    const x=pos.getX(i), y=pos.getY(i);
    pos.setZ(i, Math.sin(x*0.08)*Math.cos(y*0.08)*1.6 + Math.random()*0.8);
  }
  bedGeo.computeVertexNormals();
  causticMat = new THREEJS.MeshStandardMaterial({
    color:0xece0c2, roughness:1, map:sandTexture(),
    emissive:0xbfeaff, emissiveMap:causticsTexture(), emissiveIntensity:0.55
  });
  const bed = new THREEJS.Mesh(bedGeo, causticMat);
  bed.rotation.x = -Math.PI/2;
  bed.position.y = CFG.seabedY;
  scene.add(bed);

  // --- 水中の光柱 ---
  for(let i=0;i<9;i++){
    const ray = new THREEJS.Mesh(
      new THREEJS.CylinderGeometry(0.45, 4.8, 80, 12, 1, true),
      new THREEJS.MeshBasicMaterial({ color:0xbdf7ff, transparent:true, opacity:0.055, side:THREEJS.DoubleSide, depthWrite:false })
    );
    ray.position.set(rand(-55,55), -34, rand(-150,20));
    ray.rotation.z = rand(-0.18,0.18);
    scene.add(ray);
  }

  // --- 岩・サンゴをゾーンごとに配置 ---
  scatterRocks('shallow', 10, 0x6b7a55);
  scatterRocks('rocky', 26, 0x6a6258);
  scatterRocks('deep', 42, 0x3a3530);
  buildEscapeRocks();

  // --- サンゴ / イソギンチャク / 浮遊物 ---
  decorate('shallow', 16);
  decorate('rocky', 22);
  decorate('deep', 16);
  buildParticles();

  // --- 船 + 帰還地点マーカー ---
  buildBoat();

  // --- 帰還ロープ（船 → 岩場付近）---
  buildRope();

  // --- 追加ボンベ 3個 ---
  spawnTank(new THREEJS.Vector3(  6, CFG.seabedY+3, -22)); // 浅瀬
  spawnTank(new THREEJS.Vector3(-10, CFG.seabedY+4, -68)); // 岩場
  spawnTank(new THREEJS.Vector3(  4, CFG.seabedY+3, -128));// 奥

  // --- 魚 ---
  for(let i=0;i<8;i++)  spawnFish('aji');
  for(let i=0;i<7;i++)  spawnFish('saba');
  for(let i=0;i<5;i++)  spawnFish('ika');

  // --- クラゲ（岩場・奥）---
  for(let i=0;i<5;i++)  spawnJelly('rocky');
  for(let i=0;i<9;i++)  spawnJelly('deep');

  buildHunter();
}

function rand(a,b){ return a + Math.random()*(b-a); }

function scatterRocks(zone, n, color){
  const z = ZONE[zone];
  for(let i=0;i<n;i++){
    const s = rand(0.8, 3.2);
    const geo = new THREEJS.DodecahedronGeometry(s, 0);
    const mat = new THREEJS.MeshStandardMaterial({ color, roughness:1, flatShading:true });
    const m = new THREEJS.Mesh(geo, mat);
    m.position.set(rand(-30,30), CFG.seabedY + s*0.4, rand(z.zMin, z.zMax));
    m.rotation.set(rand(0,3),rand(0,3),rand(0,3));
    scene.add(m);
    // たまにサンゴ（細い円柱）
    if(Math.random()<0.4){

// サンゴ・イソギンチャク・ソフトコーラルを撒く
function decorate(zone, n){
  const z = ZONE[zone];
  const fanCols  = zone==='deep' ? ['#b85a8a','#9a5fb0','#c4663a'] : ['#e8743a','#e85a5a','#d9913a','#c4567a'];
  const warmCols = zone==='deep' ? [0xb05a8a,0x8a5fb0,0x55a0a0] : [0xff7a3a,0xff9ad1,0xffcf5a,0x55c0b0];
  for(let i=0;i<n;i++){
    const px=rand(-30,30), pz=rand(z.zMin+2, z.zMax-2), r=Math.random();
    if(r<0.4){
      // ウミウチワ（板テクスチャ）
      const sz=rand(3,6);
      const fan=new THREEJS.Mesh(new THREEJS.PlaneGeometry(sz,sz),
        new THREEJS.MeshStandardMaterial({ map:seaFanTexture(fanCols[(Math.random()*fanCols.length)|0]), transparent:true, alphaTest:0.4, side:THREEJS.DoubleSide, roughness:.9 }));
      fan.position.set(px, CFG.seabedY+sz*0.45, pz); fan.rotation.y=rand(0,6);
      scene.add(fan);
      swayers.push({ obj:fan, phase:rand(0,6), amp:0.06, base:fan.rotation.z });
    } else if(r<0.78){
      // イソギンチャク（揺れる触手）
      scene.add(makeAnemone(new THREEJS.Vector3(px,CFG.seabedY+0.2,pz), warmCols[(Math.random()*warmCols.length)|0]));
    } else {
      // ソフトコーラル（こぶ状の塊）
      const g=new THREEJS.Group(), col=warmCols[(Math.random()*warmCols.length)|0], n2=3+(Math.random()*4|0);
      for(let k=0;k<n2;k++){
        const b=new THREEJS.Mesh(new THREEJS.SphereGeometry(rand(0.3,0.7),8,7),
          new THREEJS.MeshStandardMaterial({color:col, roughness:.7}));
        b.position.set(rand(-0.8,0.8),rand(0.2,1.4),rand(-0.8,0.8)); b.scale.y=rand(1,1.8); g.add(b);
      }
      g.position.set(px,CFG.seabedY+0.2,pz); scene.add(g);
      swayers.push({ obj:g, phase:rand(0,6), amp:0.05, base:0 });
    }
  }
}

function makeAnemone(pos, color){
  const g=new THREEJS.Group(), col=new THREEJS.Color(color);
  const base=new THREEJS.Mesh(new THREEJS.CylinderGeometry(0.5,0.7,0.6,12),
    new THREEJS.MeshStandardMaterial({color:col.clone().multiplyScalar(0.7), roughness:.8}));
  base.position.y=0.3; g.add(base);
  const crown=new THREEJS.Group(); crown.position.y=0.55; g.add(crown);
  const tn=18+(Math.random()*10|0);
  for(let i=0;i<tn;i++){
    const len=rand(0.7,1.4);
    const t=new THREEJS.Mesh(new THREEJS.CylinderGeometry(0.025,0.06,len,5),
      new THREEJS.MeshStandardMaterial({color:col, emissive:col.clone().multiplyScalar(0.25), roughness:.6}));
    const a=Math.random()*Math.PI*2, sp=rand(0.05,0.45);
    t.position.set(Math.cos(a)*sp, len*0.5, Math.sin(a)*sp);
    t.rotation.set(Math.cos(a)*0.5, 0, -Math.sin(a)*0.5);
    crown.add(t);
  }
  g.position.copy(pos);
  swayers.push({ obj:crown, phase:rand(0,6), amp:0.12, base:0, scaleY:true });
  return g;
}

function buildRope(){
  // 船から岩場手前まで、ブイ付きのロープ
  const start = new THREEJS.Vector3(CFG.boatPos.x, -1, CFG.boatPos.z);
  const end   = new THREEJS.Vector3(2, CFG.seabedY+6, -55);
  const segs = 24;
  const pts = [];
  for(let i=0;i<=segs;i++){
    const t = i/segs;
    const p = start.clone().lerp(end, t);
    p.y += Math.sin(t*Math.PI)* -3; // たわみ
    pts.push(p);
  }
  const curve = new THREEJS.CatmullRomCurve3(pts);
  const tube = new THREEJS.Mesh(
    new THREEJS.TubeGeometry(curve, 40, 0.08, 6, false),
    new THREEJS.MeshStandardMaterial({ color:0xeedd55, roughness:.9 })
  );
  scene.add(tube);
  // ブイ
  for(let i=0;i<=segs;i+=4){
    const b = new THREEJS.Mesh(
      new THREEJS.SphereGeometry(0.22, 8, 8),
      new THREEJS.MeshStandardMaterial({ color:0xff5533, emissive:0x551100 })
    );
    b.position.copy(pts[i]); scene.add(b);
  }
}

function makeFishMesh(key){
  const d = FISH_DEF[key];
  const back  = key==='saba'?0x244e57 : key==='aji'?0x7c8a98 : 0xe7cdb6;
  const belly = key==='saba'?0xdfeef0 : key==='aji'?0xeef3f7 : 0xfff7ee;
  const g = new THREEJS.Group(), inner = new THREEJS.Group(); g.add(inner);
  let tail=null, parts=[];

  if(key==='ika'){
    const matBody=new THREEJS.MeshStandardMaterial({color:d.color, roughness:.5, transparent:true, opacity:0.9, emissive:0x332b22, emissiveIntensity:0.3});
    const mantle=new THREEJS.Mesh(new THREEJS.ConeGeometry(d.size*0.42,d.size*1.7,12), matBody);
    mantle.rotation.x=-Math.PI/2; mantle.position.z=d.size*0.5; inner.add(mantle);
    for(const sgn of [-1,1]){
      const fin=new THREEJS.Mesh(new THREEJS.ConeGeometry(d.size*0.5,d.size*0.5,3), matBody);
      fin.scale.set(1,0.25,1); fin.rotation.z=Math.PI/2*sgn; fin.position.set(sgn*d.size*0.4,0,d.size*1.0);
      inner.add(fin); parts.push({m:fin,t:'finIka'});
    }
    const tg=new THREEJS.Group(); tg.position.z=-d.size*0.4; inner.add(tg);
    for(let i=0;i<8;i++){
      const t=new THREEJS.Mesh(new THREEJS.CylinderGeometry(0.03,0.015,d.size*1.0,5), matBody);
      const a=i/8*Math.PI*2; t.position.set(Math.cos(a)*0.12,Math.sin(a)*0.12,-d.size*0.5); t.rotation.x=Math.PI/2; tg.add(t);
    }
    parts.push({m:tg,t:'tentacles'});
    for(const sgn of [-1,1]){
      const e=new THREEJS.Mesh(new THREEJS.SphereGeometry(d.size*0.1,8,8), new THREEJS.MeshStandardMaterial({color:0x111111}));
      e.position.set(sgn*d.size*0.22,0,-d.size*0.05); inner.add(e);
    }
  } else {
    const matBody=new THREEJS.MeshStandardMaterial({color:d.color, roughness:.45, metalness:.25});
    const matBack=new THREEJS.MeshStandardMaterial({color:back, roughness:.5, metalness:.2});
    const matBelly=new THREEJS.MeshStandardMaterial({color:belly, roughness:.4, metalness:.3});
    const body=new THREEJS.Mesh(new THREEJS.SphereGeometry(d.size*0.5,14,12), matBody); body.scale.set(0.6,0.82,1.75); inner.add(body);
    const bel=new THREEJS.Mesh(new THREEJS.SphereGeometry(d.size*0.5,14,10,0,Math.PI*2,Math.PI*0.55,Math.PI*0.45), matBelly); bel.scale.set(0.61,0.83,1.72); inner.add(bel);
    const bk=new THREEJS.Mesh(new THREEJS.SphereGeometry(d.size*0.5,14,10,0,Math.PI*2,0,Math.PI*0.32), matBack); bk.scale.set(0.55,0.84,1.7); inner.add(bk);
    tail=new THREEJS.Group(); tail.position.z=d.size*0.95; inner.add(tail);
    const fin=new THREEJS.Mesh(new THREEJS.ConeGeometry(d.size*0.45,d.size*0.7,4), matBody); fin.rotation.x=Math.PI/2; tail.add(fin); tail.scale.set(0.16,1,1);
    const dfin=new THREEJS.Mesh(new THREEJS.ConeGeometry(d.size*0.3,d.size*0.4,3), matBack); dfin.scale.set(0.1,1,1.4); dfin.position.set(0,d.size*0.42,0); inner.add(dfin);
    for(const sgn of [-1,1]){
      const pf=new THREEJS.Mesh(new THREEJS.ConeGeometry(d.size*0.2,d.size*0.4,3), matBody);
      pf.scale.set(0.08,1,1); pf.rotation.z=Math.PI/2*sgn; pf.position.set(sgn*d.size*0.32,-d.size*0.05,-d.size*0.2); inner.add(pf); parts.push({m:pf,t:'pec'});
    }
    for(const sgn of [-1,1]){
      const e=new THREEJS.Mesh(new THREEJS.SphereGeometry(d.size*0.09,8,8), new THREEJS.MeshStandardMaterial({color:0x0a0a0a}));
      e.position.set(sgn*d.size*0.2, d.size*0.08, -d.size*0.62); inner.add(e);
    }
  }
  g.userData={inner, tail, parts, phase:rand(0,6.28)};
  return g;
}

// ============================================================
//  入力
// ============================================================
function bindEvents(){
  addEventListener('resize', ()=>{
    camera.aspect = innerWidth/innerHeight; camera.updateProjectionMatrix();
    renderer.setSize(innerWidth, innerHeight);
  });
  addEventListener('keydown', e=>{
    keys[e.code]=true;
    if(e.code==='Digit1') setGear('spear');
    if(e.code==='Digit2') setGear('net');
    if(e.code==='KeyE') tryReturn();
    if(['Space','ShiftLeft','ArrowUp','ArrowDown','ArrowLeft','ArrowRight'].includes(e.code)) e.preventDefault();
  });
  addEventListener('keyup', e=>{ keys[e.code]=false; });

  renderer.domElement.addEventListener('click', ()=>{
    if(!state.running) return;
    if(!pointerLocked) tryPointerLock();
    doAction();
  });
  document.addEventListener('pointerlockchange', ()=>{
    pointerLocked = (document.pointerLockElement === renderer.domElement);
  });
  document.addEventListener('mousemove', e=>{
    if(!pointerLocked || !state.running) return;
    player.yaw   -= e.movementX * 0.0022;
    player.pitch -= e.movementY * 0.0022;
    player.pitch = Math.max(-1.4, Math.min(1.4, player.pitch));
  });

  $('start-btn').onclick = startGame;
  $('restart-btn').onclick = startGame;
}

function tryPointerLock(){
  try {
    const lock = renderer.domElement.requestPointerLock && renderer.domElement.requestPointerLock();
    if(lock && typeof lock.catch === 'function') lock.catch(()=>{});
  } catch (_) {}
}

function setGear(g){
  state.gear=g;
  $('gear-spear').classList.toggle('active', g==='spear');
  $('gear-net').classList.toggle('active', g==='net');
  $('held-tool').className = g;
}

// ============================================================
//  ゲーム開始 / 終了
// ============================================================
function startGame(){
  // リセット
  state.running=true; state.oxygen=CFG.oxygenStart; state.gear='spear';
  state.basketWeight=0; state.basketValue=0; state.caught=[]; state.stun=0; state.inkTimer=0; state.hunterAlert=0;
  setGear('spear');

  // 魚・クラゲ・ボンベを復活
  fishes.forEach(f=>{ if(!f.alive){ f.alive=true; f.mesh.visible=true; } });
  tanks.forEach(t=>{ t.visible=true; t.userData.used=false; });

  // プレイヤーを船から少し離した浅瀬に置き、奥の岩場が見える向きで開始
  camera.position.set(CFG.boatPos.x, -6, CFG.boatPos.z - 12);
  player.yaw = 0; player.pitch = -0.08; player.vel.set(0,0,0);
  resetHunter();

  $('start-screen').classList.add('hidden');
  $('result-screen').classList.add('hidden');
  tryPointerLock();
}

function resetHunter(){
  if(!hunter) return;
  hunter.visible = false;
  hunter.position.set(rand(-18,18), -17, -146);
  hunter.userData.mode = 'idle';
  hunter.userData.cooldown = 7;
  hunter.userData.biteCD = 0;
  hunter.userData.alert = 0;
}

function gameOver(){
  if(!state.running) return;
  state.running=false;
  document.exitPointerLock();
  showResult(false);
}

function tryReturn(){
  if(!state.running) return;
  const dx = camera.position.x - CFG.boatPos.x;
  const dz = camera.position.z - CFG.boatPos.z;
  const dist = Math.hypot(dx,dz);
  if(dist <= CFG.returnRadius && camera.position.y > -1.2){
    state.running=false;
    document.exitPointerLock();
    showResult(true);
  } else {
    toast('船の近くで水面まで戻ってE');
  }
}

function showResult(success){
  const list = $('result-list');
  list.innerHTML='';
  $('result-title').textContent = success ? '帰還 — 売上確定' : 'ゲームオーバー';
  $('result-title').style.color = success ? '#6fe3ff' : '#ff7a7a';

  if(!success){
    list.innerHTML = '<div style="opacity:.8">酸素が尽きた。売上はなし。</div>';
    $('result-total').textContent = '合計 0 円';
    $('result-sub').textContent = `捕った魚 ${state.caught.length} 匹は海の底へ…`;
    $('result-screen').classList.remove('hidden');
    return;
  }

  // 集計
  const agg = {}; // key -> {count, gross, dmg}
  let total=0, dmgTotal=0;
  state.caught.forEach(c=>{
    const d=FISH_DEF[c.key];
    let v=d.value;
    let dmg=0;
    if(c.method==='spear'){ const reduced=Math.round(d.value*0.8); dmg = d.value-reduced; v=reduced; }
    agg[c.key] = agg[c.key] || {count:0, gross:0, dmg:0};
    agg[c.key].count++; agg[c.key].gross += v; agg[c.key].dmg += dmg;
    total += v; dmgTotal += dmg;
  });

  Object.keys(agg).forEach(k=>{
    const a=agg[k], d=FISH_DEF[k];
    const div=document.createElement('div'); div.className='line';
    div.innerHTML=`<span>${d.name} ×${a.count}</span><span>${a.gross} 円</span>`;
    list.appendChild(div);
  });
  if(dmgTotal>0){
    const div=document.createElement('div'); div.className='line dmg';
    div.innerHTML=`<span>銛ダメージ補正</span><span>-${dmgTotal} 円</span>`;
    list.appendChild(div);
  }
  if(state.caught.length===0){
    list.innerHTML='<div style="opacity:.7">かごは空っぽ。出直しだ。</div>';
  }
  $('result-total').textContent = `合計 ${total} 円`;
  $('result-sub').textContent = `残り酸素 ${Math.ceil(state.oxygen)}秒で帰還`;
  $('result-screen').classList.remove('hidden');
}

//  捕獲アクション
// ============================================================
const raycaster = new THREEJS.Raycaster();
function doAction(){
  if(state.stun>0) return;
  if(state.gear==='spear') fireSpear();
  else castNet();
}

function fireSpear(){
  // 視線方向のレイで魚をヒット（中〜遠）
  raycaster.set(camera.position, getForward());
  raycaster.far = 25;
  let best=null, bestDist=Infinity;
  fishes.forEach(f=>{
    if(!f.alive) return;
    const dist = camera.position.distanceTo(f.mesh.position);
    if(dist>25) return;
    // レイと魚の角度判定
    const toFish = f.mesh.position.clone().sub(camera.position).normalize();
    const dot = toFish.dot(getForward());
    if(dot>0.985 && dist<bestDist){ best=f; bestDist=dist; }
  });
  if(best){ capture(best,'spear'); }
  else toast('外した');
}

function castNet(){
  // 近距離・広め
  let best=null, bestDist=Infinity;
  fishes.forEach(f=>{
    if(!f.alive) return;
    const dist=camera.position.distanceTo(f.mesh.position);
    if(dist>4.5) return;
    const toFish=f.mesh.position.clone().sub(camera.position).normalize();
    const dot=toFish.dot(getForward());
    if(dot>0.55 && dist<bestDist){ best=f; bestDist=dist; }
  });
  if(best){ capture(best,'net'); }
  else { toast('空振り…'); state.stun=0.6; } // 外すと硬直
}

function capture(f, method){
  const d=FISH_DEF[f.key];
  if(state.basketWeight + d.weight > CFG.basketMax){
    toast('かごがいっぱい！');
    return;
  }
  // 捕獲成立
  f.alive=false; f.mesh.visible=false;
  state.basketWeight += d.weight;
  let v = method==='spear' ? Math.round(d.value*0.8) : d.value;
  state.basketValue += v;
  state.caught.push({ key:f.key, method });
  toast(`${d.name} 捕獲！ +${v}円`);
}

// ============================================================
//  ユーティリティ
// ============================================================
function getForward(){
  const f=new THREEJS.Vector3(0,0,-1);
  const e=new THREEJS.Euler(player.pitch, player.yaw, 0, 'YXZ');
  return f.applyEuler(e).normalize();
}
let toastTimer=null;
function toast(msg){
  const t=$('toast'); t.textContent=msg; t.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer=setTimeout(()=>t.classList.remove('show'), 1400);
}

// ============================================================
//  メインループ
// ============================================================
function animate(){
  requestAnimationFrame(animate);
  const dt = Math.min(clock.getDelta(), 0.05);
  if(state.running) update(dt);
  updateInk(dt);
  updateScenery(dt);
  renderer.render(scene, camera);
}

// 海底のコースティクス・サンゴの揺れ・浮遊物（常時）
function updateScenery(dt){
  const t=performance.now()*0.001;
  if(causticMat && causticMat.emissiveMap){
    causticMat.emissiveMap.offset.x = t*0.012;
    causticMat.emissiveMap.offset.y = Math.sin(t*0.2)*0.02;
  }
  swayers.forEach(s=>{
    s.obj.rotation.z = s.base + Math.sin(t*0.8+s.phase)*s.amp;
    if(s.scaleY) s.obj.scale.y = 1 + Math.sin(t*1.3+s.phase)*0.06;
  });
  if(snow){
    const a=snow.geometry.attributes.position.array;
    for(let i=1;i<a.length;i+=3){ a[i]-=dt*0.35; a[i-1]+=Math.sin(t+a[i])*dt*0.05; if(a[i]<CFG.seabedY) a[i]=-0.5; }
    snow.geometry.attributes.position.needsUpdate=true;
  }
}

function update(dt){
  // --- 視点（キーボードfallback）---
  if(keys['ArrowLeft'])  player.yaw += 1.6*dt;
  if(keys['ArrowRight']) player.yaw -= 1.6*dt;
  if(keys['ArrowUp'])    player.pitch = Math.min(1.4, player.pitch+1.2*dt);
  if(keys['ArrowDown'])  player.pitch = Math.max(-1.4, player.pitch-1.2*dt);

  // --- 移動 ---
  if(state.stun>0) state.stun-=dt;
  const fwd = getForward();
  const right = new THREEJS.Vector3().crossVectors(fwd, new THREEJS.Vector3(0,1,0)).normalize();
  const accel = new THREEJS.Vector3();
  const speed = 9;
  if(state.stun<=0){
    if(keys['KeyW']) accel.add(fwd);
    if(keys['KeyS']) accel.sub(fwd);
    if(keys['KeyD']) accel.add(right);
    if(keys['KeyA']) accel.sub(right);
    if(keys['Space']) accel.y += 1;
    if(keys['ShiftLeft']||keys['ShiftRight']) accel.y -= 1;
  }
  if(accel.lengthSq()>0) accel.normalize().multiplyScalar(speed);
  // 水中の抵抗
  player.vel.lerp(accel, 1-Math.pow(0.0001, dt));
  camera.position.addScaledVector(player.vel, dt);

  // 境界クランプ
  camera.position.y = Math.max(CFG.seabedY+1.2, Math.min(CFG.surfaceY+0.35, camera.position.y));
  camera.position.x = Math.max(-34, Math.min(34, camera.position.x));
  camera.position.z = Math.max(-158, Math.min(14, camera.position.z));

  // カメラ回転適用
  camera.quaternion.setFromEuler(new THREEJS.Euler(player.pitch, player.yaw, 0, 'YXZ'));

  // --- ゾーン演出（フォグ/色）---
  const zone = zoneAt(camera.position.z);
  applyZoneVisual(zone, dt);

  // --- 酸素 ---
  const atSurface = camera.position.y >= -0.2;
  if(atSurface){
    state.oxygen = Math.min(CFG.oxygenStart, state.oxygen + CFG.surfaceRecover * dt);
  } else {
    let drain = dt;
    if(zone==='deep') drain *= CFG.deepDrainMul;
    if(state.inkTimer>0){ drain *= 1.3; state.inkTimer-=dt; } // 墨で帰還が遅れる→消費増
    state.oxygen -= drain;
  }
  if(state.oxygen<=0){ state.oxygen=0; updateHUD(zone); gameOver(); return; }

  // --- 魚 AI ---
  updateFishes(dt);
  // --- クラゲ ---
  updateJellies(dt);
  // --- ボンベ取得 ---
  updateTanks();
  // --- 深海ハンター ---
  updateHunter(dt, zone, atSurface);

  updateHUD(zone);
}

let curFog = 0.012, curCol = new THREEJS.Color(0x2596bd);
const ZONE_FOG = { shallow:0.010, rocky:0.020, deep:0.05 };
const ZONE_COL = { shallow:new THREEJS.Color(0x2ba0c6), rocky:new THREEJS.Color(0x12698c), deep:new THREEJS.Color(0x041f2e) };
function applyZoneVisual(zone, dt){
  const k = 1-Math.pow(0.001, dt);
  curFog += (ZONE_FOG[zone]-curFog)*k;
  curCol.lerp(ZONE_COL[zone], k);
  scene.fog.density = curFog;
  scene.background.copy(curCol);
}

function updateFishes(dt){
  const pp = camera.position;
  fishes.forEach(f=>{
    if(!f.alive) return;
    const d=FISH_DEF[f.key];
    const m=f.mesh;
    const distToPlayer = m.position.distanceTo(pp);
    let dir;
    if(distToPlayer < d.detect){
      // 逃げる
      dir = m.position.clone().sub(pp); dir.y*=0.5; dir.normalize();
      // イカは墨を吐く
      if(f.key==='ika' && distToPlayer<5 && Math.random()<0.5*dt*10){
        state.inkTimer = 1.6; // 視界悪化
        emitInk(m.position);
      }
      f.dir.lerp(dir, 0.1);
    } else {
      // ふらふら徘徊
      f.wander += dt;
      dir = new THREEJS.Vector3(Math.sin(f.wander*0.7), Math.sin(f.wander*0.3)*0.2, Math.cos(f.wander*0.5));
      f.dir.lerp(dir.normalize(), 0.02);
    }
    const sp = (distToPlayer<d.detect ? d.speed*1.4 : d.speed*0.5);
    m.position.addScaledVector(f.dir, sp*dt);

    // ゾーン内に閉じ込め + 高さ
    const z=ZONE[d.zone];
    m.position.z = Math.max(z.zMin+1, Math.min(z.zMax-1, m.position.z));
    m.position.x = Math.max(-30, Math.min(30, m.position.x));
    m.position.y = Math.max(CFG.seabedY+1.5, Math.min(-2.5, m.position.y));
    // 向き
    if(f.dir.lengthSq()>0.001){
      const look = m.position.clone().add(f.dir);
      m.lookAt(look);
    }
    // 泳ぎモーション
    const ud=m.userData;
    if(ud && ud.parts){
      const fleeing = distToPlayer < d.detect;
      const tt=performance.now()*0.001;
      const wag=Math.sin(tt*(fleeing?14:8)+ud.phase);
      if(ud.tail) ud.tail.rotation.y=wag*(fleeing?0.7:0.45);
      if(ud.inner) ud.inner.rotation.y=wag*0.12;
      ud.parts.forEach(p=>{
        if(p.t==='pec') p.m.rotation.x=Math.sin(tt*6+ud.phase)*0.3;
        else if(p.t==='finIka') p.m.rotation.x=Math.sin(tt*7+ud.phase)*0.25;
        else if(p.t==='tentacles') p.m.rotation.z=Math.sin(tt*4+ud.phase)*0.15;
      });
    }
  });
}

let inkClouds=[];
function emitInk(pos){
  const ink=new THREEJS.Mesh(
    new THREEJS.SphereGeometry(0.5,8,8),
    new THREEJS.MeshBasicMaterial({ color:0x05080a, transparent:true, opacity:0.85 })
  );
  ink.position.copy(pos);
  ink.userData={ life:1.6 };
  scene.add(ink); inkClouds.push(ink);
}
function updateInk(dt){
  inkClouds = inkClouds.filter(ink=>{
    ink.userData.life-=dt;
    const s = 1 + (1.6-ink.userData.life)*3;
    ink.scale.set(s,s,s);
    ink.material.opacity = Math.max(0, ink.userData.life/1.6*0.85);
    if(ink.userData.life<=0){ scene.remove(ink); return false; }
    return true;
  });
}

function updateJellies(dt){
  const t=performance.now()*0.001;
  const pp=camera.position;
  jellies.forEach(j=>{
    // ふわふわ上下
    j.position.y = j.userData.base.y + Math.sin(t*0.6 + j.userData.phase)*1.2;
    j.position.x = j.userData.base.x + Math.sin(t*0.3 + j.userData.phase)*0.6;
    // 接触判定
    if(j.position.distanceTo(pp) < 1.6 && !j.userData.hitCD){
      state.oxygen -= CFG.jellyDamage;
      toast(`クラゲに触れた！ 酸素 -${CFG.jellyDamage}s`);
      j.userData.hitCD = 1.5;
      // ノックバック
      const kb=pp.clone().sub(j.position).normalize().multiplyScalar(6);
      player.vel.add(kb);
    }
    if(j.userData.hitCD){ j.userData.hitCD-=dt; if(j.userData.hitCD<=0) j.userData.hitCD=0; }
  });
}

function updateTanks(){
  const pp=camera.position;
  const t=performance.now()*0.002;
  tanks.forEach(tk=>{
    if(!tk.visible) return;
    tk.rotation.y = t;
    tk.userData.glow.material.opacity = 0.12 + Math.sin(t*4)*0.06;
    if(tk.position.distanceTo(pp) < 2.2){
      state.oxygen = Math.min(CFG.oxygenStart, state.oxygen + CFG.oxygenTank);
      tk.visible=false;
      toast(`ボンベ獲得！ 酸素 +${CFG.oxygenTank}s`);
    }
  });
}

function updateHunter(dt, zone, atSurface){
  if(!hunter) return;
  const h = hunter.userData;
  const pp = camera.position;
  if(h.cooldown>0) h.cooldown -= dt;
  if(h.biteCD>0) h.biteCD -= dt;

  const inDeep = zone === 'deep' && pp.y < -3;
  const nearHideHole = pp.distanceTo(new THREEJS.Vector3(-21, -23, -135)) < 6.5;
  const passedArch = pp.distanceTo(new THREEJS.Vector3(0, -24, -118)) < 7.5;

  if(atSurface || !inDeep || nearHideHole || passedArch){
    if(h.mode === 'chase' && (nearHideHole || passedArch)) toast('岩場でハンターを撒いた');
    h.mode = 'idle';
    h.alert = Math.max(0, h.alert - dt*2.4);
    if(atSurface || zone !== 'deep') hunter.visible = false;
    if(nearHideHole || passedArch) h.cooldown = Math.max(h.cooldown, 5);
    state.hunterAlert = h.alert;
    return;
  }

  if(h.mode === 'idle' && h.cooldown <= 0){
    h.mode = 'chase';
    hunter.visible = true;
    const side = Math.random()<.5 ? -1 : 1;
    hunter.position.set(pp.x + side*22, pp.y + rand(-2,3), pp.z - rand(18,28));
    toast('深海に大きな影がいる');
  }

  if(h.mode !== 'chase'){
    state.hunterAlert = h.alert;
    return;
  }

  const toPlayer = pp.clone().sub(hunter.position);
  const dist = toPlayer.length();
  const dir = toPlayer.normalize();
  const speed = dist > 18 ? 11 : 8.2;
  hunter.position.addScaledVector(dir, speed * dt);
  hunter.position.y = Math.max(CFG.seabedY+4, Math.min(-2.5, hunter.position.y));
  hunter.lookAt(pp);
  hunter.rotateY(Math.PI/2);

  let targetAlert = 0;
  if(dist < 34) targetAlert = .25;
  if(dist < 22) targetAlert = .55;
  if(dist < 11) targetAlert = .95;
  h.alert += (targetAlert - h.alert) * (1-Math.pow(.001, dt));
  state.hunterAlert = h.alert;

  if(dist < 3.5 && h.biteCD <= 0){
    state.oxygen = Math.max(0, state.oxygen - CFG.hunterDamage);
    h.biteCD = 2.4;
    h.cooldown = 3.5;
    h.mode = 'idle';
    hunter.visible = false;
    const kb = pp.clone().sub(hunter.position).normalize().multiplyScalar(12);
    player.vel.add(kb);
    toast(`ハンターに接触！ 酸素 -${CFG.hunterDamage}s`);
  }
}

// ============================================================
//  HUD更新
// ============================================================
function updateHUD(zone){
  // 酸素
  const pct = Math.max(0, state.oxygen/CFG.oxygenStart*100);
  $('oxygen-bar').style.width = pct+'%';
  $('oxygen-num').textContent = Math.ceil(state.oxygen)+'s';
  $('oxygen-bar').style.background = state.oxygen<30
    ? 'linear-gradient(90deg,#ff4a4a,#ff7a3d)'
    : 'linear-gradient(90deg,#ffd24a,#ff8a3d)';

  // かご
  $('basket-weight').textContent = state.basketWeight;
  $('basket-value').textContent = state.basketValue;
  $('weight-bar').style.width = (state.basketWeight/CFG.basketMax*100)+'%';

  // 深度
  const depth = Math.max(0, -camera.position.y);
  $('depth').textContent = `DEPTH ${depth.toFixed(1)}m / ${zone==='shallow'?'浅瀬':zone==='rocky'?'岩場':'奥エリア'}`;
  $('surface-hint').style.opacity = camera.position.y >= -0.2 ? '1' : '0';

  // コンパス
  const dx=CFG.boatPos.x-camera.position.x, dz=CFG.boatPos.z-camera.position.z;
  const dist=Math.hypot(dx,dz);
  $('compass-dist').textContent = Math.round(dist)+'m';
  // 船方向 vs 視線方向の相対角
  const boatAngle = Math.atan2(dx, dz);          // ワールド角
  const viewAngle = player.yaw + Math.PI;         // カメラ前方の水平角(補正)
  let rel = boatAngle - viewAngle;
  while(rel>Math.PI) rel-=Math.PI*2; while(rel<-Math.PI) rel+=Math.PI*2;
  $('compass-arrow').style.transform = `rotate(${rel}rad)`;

  // 低酸素ガイド
  const comp=$('compass');
  if(state.oxygen<=60) comp.classList.add('alert'); else comp.classList.remove('alert');
  const ra=$('return-arrow');
  if(state.oxygen<=30){
    ra.style.opacity='1';
    ra.style.transform = `translate(-50%,-50%) rotate(${rel}rad) translateY(-150px)`;
  } else ra.style.opacity='0';

  const danger = Math.max(0, Math.min(1, state.hunterAlert || 0));
  $('danger-vignette').style.opacity = danger > .05 ? String(.18 + danger*.72) : '0';
  $('danger-text').style.opacity = danger > .45 ? String(danger) : '0';
}

init();
</script>
